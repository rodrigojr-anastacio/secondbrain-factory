# Constrói a imagem de render em GPU (só dependências) e publica em ghcr.io/rodrigojr-anastacio/fabrica-render-gpu.
# Usada por tools/render_runpod.sh. O Runpod puxa sem credencial: o pacote precisa estar PÚBLICO
# (github.com/users/rodrigojr-anastacio/packages → fabrica-render-gpu → Package settings → Change visibility → Public).
# Nota (11/11/2026): no runner o DNS não resolve dentro de contêiner ("Could not resolve archive.ubuntu.com"), nem com
# --network host; por isso o passo "DNS do Docker" aponta o daemon para o resolvedor real da VM (sem buildx). O log do Actions exige login: erros viram anotação (::error::),
# que a API pública mostra.
name: render-gpu-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/render-gpu-image/**
      - .github/workflows/render-gpu-image.yml
permissions:
  contents: read
  packages: write
env:
  IMG: ghcr.io/rodrigojr-anastacio/fabrica-render-gpu
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/render-gpu-image
      - name: DNS do Docker = resolvedor real da VM (o 127.0.0.53 do systemd-resolved não serve dentro do contêiner)
        run: |
          NS=$(awk '/^nameserver/ && $2 !~ /^127\./ {print $2}' /run/systemd/resolve/resolv.conf | head -2 | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()] or ['168.63.129.16']))")
          echo "{\"dns\": $NS}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker run --rm ubuntu:22.04 getent hosts archive.ubuntu.com > dns.txt 2>&1 \
            && echo "::notice title=dns ok::$NS $(cat dns.txt)" \
            || { echo "::error title=dns::$NS $(cat dns.txt) | $(cat /run/systemd/resolve/resolv.conf | tr '\n' ' ')"; exit 1; }
      - name: build
        run: |
          set +e
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label "org.opencontainers.image.description=Render Remotion em GPU (Runpod): Node, Chrome Headless Shell, libs GL/EGL/Vulkan, ffmpeg, fontes. Sem projeto, mídia ou segredo." \
            -t $IMG:latest -t $IMG:${{ github.sha }} tools/render-gpu-image > build.txt 2>&1
          rc=$?
          if [ $rc != 0 ]; then echo "::error title=docker build::$(tail -25 build.txt | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; fi
          echo "::notice title=imagem::$(docker image ls $IMG:latest --format '{{.Size}}')"
      - name: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMG:latest > push.txt 2>&1 && docker push $IMG:${{ github.sha }} >> push.txt 2>&1 \
            || { echo "::error title=docker push::$(tail -10 push.txt | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
