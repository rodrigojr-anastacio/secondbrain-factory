# Constrói a imagem de render em GPU (só dependências) e publica em ghcr.io/rodrigojr-anastacio/fabrica-render-gpu.
# Usada por tools/render_runpod.sh. O Runpod puxa sem credencial: o pacote precisa estar PÚBLICO
# (github.com/users/rodrigojr-anastacio/packages → fabrica-render-gpu → Package settings → Change visibility → Public).
# Nota (11/11/2026): no runner o DNS não resolve dentro de contêiner ("Could not resolve archive.ubuntu.com"), nem com
# --network host nem com o DNS do daemon trocado; por isso os nomes são resolvidos no host e passados com --add-host (sem buildx). O log do Actions exige login: erros viram anotação (::error::),
# que a API pública mostra.
name: render-gpu-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/render-gpu-image/**
      - .github/workflows/render-gpu-image.yml
permissions:
  contents: read
  packages: write
env:
  IMG: ghcr.io/rodrigojr-anastacio/fabrica-render-gpu
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/render-gpu-image
      - name: diagnóstico de rede do Docker (vira anotação)
        run: |
          {
            echo "host: $(getent hosts archive.ubuntu.com | head -1)"; echo "host resolv: $(grep -v '^#' /etc/resolv.conf | tr '\n' ' ')"
            echo "bridge dns: $(docker run --rm ubuntu:22.04 getent hosts archive.ubuntu.com 2>&1 | tail -1) rc=$?"
            echo "bridge resolv: $(docker run --rm ubuntu:22.04 cat /etc/resolv.conf 2>&1 | grep -v '^#' | tr '\n' ' ')"
            echo "host-net dns: $(docker run --rm --network host ubuntu:22.04 getent hosts archive.ubuntu.com 2>&1 | tail -1)"
            echo "bridge tcp 1.1.1.1:443: $(docker run --rm ubuntu:22.04 bash -c 'timeout 5 bash -c "echo > /dev/tcp/1.1.1.1/443" && echo ok || echo falhou' 2>&1 | tail -1)"
          } > diag.txt 2>&1
          echo "::notice title=rede::$(sed ':a;N;$!ba;s/\n/%0A/g' diag.txt)"
      - name: build
        run: |
          set +e
          # nomes resolvidos no host e passados como --add-host (o DNS dentro do contêiner não funciona neste runner)
          AH=""
          for h in archive.ubuntu.com security.ubuntu.com nodejs.org registry.npmjs.org remotion.media www.remotion.dev remotion.dev; do
            ip=$(getent ahostsv4 $h | awk 'NR==1{print $1}'); [ -n "$ip" ] && AH="$AH --add-host $h:$ip"
          done
          echo "add-host:$AH"
          docker build --network host $AH \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label "org.opencontainers.image.description=Render Remotion em GPU (Runpod): Node, Chrome Headless Shell, libs GL/EGL/Vulkan, ffmpeg, fontes. Sem projeto, mídia ou segredo." \
            -t $IMG:latest -t $IMG:${{ github.sha }} tools/render-gpu-image > build.txt 2>&1
          rc=$?
          if [ $rc != 0 ]; then echo "::error title=docker build::$(tail -25 build.txt | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; fi
          echo "::notice title=imagem::$(docker image ls $IMG:latest --format '{{.Size}}')"
      - name: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMG:latest > push.txt 2>&1 && docker push $IMG:${{ github.sha }} >> push.txt 2>&1 \
            || { echo "::error title=docker push::$(tail -10 push.txt | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
