# Constrói a imagem de render em GPU (só dependências) e publica em ghcr.io/rodrigojr-anastacio/fabrica-render-gpu.
# Usada por tools/render_runpod.sh. O Runpod puxa sem credencial: o pacote precisa estar PÚBLICO
# (github.com/users/rodrigojr-anastacio/packages → fabrica-render-gpu → Package settings → Change visibility → Public).
# Nota (11/11/2026): o runner do GitHub NÃO resolve *.ubuntu.com (nem no host), mas resolve deb.debian.org, nodejs.org,
# registry.npmjs.org e remotion.media: por isso a imagem é Debian. Sem buildx; --network host = DNS do host no build. O log do Actions exige login: erros viram anotação (::error::),
# que a API pública mostra.
name: render-gpu-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/render-gpu-image/**
      - .github/workflows/render-gpu-image.yml
permissions:
  contents: read
  packages: write
env:
  IMG: ghcr.io/rodrigojr-anastacio/fabrica-render-gpu
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/render-gpu-image
      - name: build
        run: |
          set +e
          # o runner não resolve *.ubuntu.com (11/11/2026): imagem Debian, espelho = o 1º da lista que resolve aqui
          M=""
          for u in http://deb.debian.org/debian http://cdn-fastly.deb.debian.org/debian http://mirrors.edge.kernel.org/debian http://ftp.us.debian.org/debian http://mirror.leaseweb.net/debian; do
            h=${u#http://}; h=${h%%/*}; getent ahostsv4 $h >/dev/null && { M=$u; break; }
          done
          [ -z "$M" ] && { echo "::error title=apt::nenhum espelho Debian resolve no runner"; exit 1; }
          docker build --network host --build-arg APT_MIRROR=$M \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label "org.opencontainers.image.description=Render Remotion em GPU (Runpod): Node, Chrome Headless Shell, libs GL/EGL/Vulkan, ffmpeg, fontes. Sem projeto, mídia ou segredo." \
            -t $IMG:latest -t $IMG:${{ github.sha }} tools/render-gpu-image > build.txt 2>&1
          rc=$?
          if [ $rc != 0 ]; then echo "::error title=docker build::espelho $M%0A$(grep -v '^#[0-9]* [0-9.]* \(Setting up\|Unpacking\|Selecting\|Preparing\|Get:\|Processing\)' build.txt | tail -30 | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; fi
          echo "::notice title=imagem::$(docker image ls $IMG:latest --format '{{.Size}}') espelho $M"
      - name: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMG:latest > push.txt 2>&1 && docker push $IMG:${{ github.sha }} >> push.txt 2>&1 \
            || { echo "::error title=docker push::$(tail -10 push.txt | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
