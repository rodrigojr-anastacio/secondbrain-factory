slug: dossie-es
nome: Dossier en Minutos       # provisório; 3 opções em identidade.md (decisão do Rodrigo). No YouTube ainda se chama "Dossiê em Minutos"
channel_id: UCVCYqeuCwTWC7Lqez_qeWRA   # criado pelo Rodrigo em 2026-11-04 (pesquisa/archive-in-minutes/AVISO-CANAL-CRIADO.md); 0 vídeos
url: https://www.youtube.com/channel/UCVCYqeuCwTWC7Lqez_qeWRA
handle_atual: "@dossieminutos"   # trocar para @dossierenminutos (livre em 2026-11-04) ao renomear
idioma: es                     # espanhol neutro latino-americano (público: MX, ES, US hispano, AR, CO…); ver estilo.md
nicho: historia completa de organizaciones (servicios secretos, policías políticas, mafias, cárteles, órdenes)
token: dossie-es               # ~/.segredos/youtube/tokens/dossie-es.json (após o OAuth, feito pelo Rodrigo)
status: em preparação (blueprint es 2026-11-04; piloto 001 CIA em produção desde 2026-11-04, OK do Rodrigo)
pesquisa:
  - pesquisa/archive-in-minutes/IDIOMA.md        # por que es (matriz de decisão)
  - pesquisa/archive-in-minutes/idioma/NOTAS.md  # demanda e concorrência por idioma
  - pesquisa/archive-in-minutes/LEVANTAMENTO.md  # anatomia do formato
formula:
  modelo: Archive in Minutes (en) + prova em es do Atlas del Tiempo (KGB 30,6 mil e Mossad 33,1 mil com 735 inscritos, 04/11)
  titulo: "TODA la historia de <la organización> en N minutos"   # TODA em caixa alta; N = duração real arredondada; X curto e famoso
  titulo_alternativo: "La historia COMPLETA de <X> en N minutos"  # para o "Testar e comparar" de título
  duracao_min: 11-16           # alvo 13; não passar de ~17
  palavras: ~1.500 para 11 min, ~1.800 para 13 min (~140 palavras/min nas amostras Fish es)
  estrutura: hook-anedota de 25-35 s → 11-14 "expedientes" (capítulos-objeto de 45-75 s, cronológicos) → cierre que volta ao objeto do hook
cadencia: 2-3 vídeos/semana no teste (3 pilotos em 2-3 semanas); nunca template em massa
voz:
  motor: fish
  voz: ac594943984a47e7a827416eb263c7b1   # "Dio Historias" (neutro, documental): ESCOLHIDA pelo Rodrigo em 2026-11-04 (BRIEF-dossie-001); alternativas em testes/voz/LEIA.md
  modelo: s2.1-pro
  velocidade: 1.0
  modo: por_frase              # tools/tts_fish.py --por-frase (padrão da fábrica desde 04/11)
  tom: narrador de documental, presente histórico, seco; tags [serious] e [slightly dramatic]
visual:
  # 23/11/2026 (decisão do Rodrigo): teste Codex no MKUltra: o próximo vídeo inteiro (cenas e thumbs) pelo Codex CLI
  # (ChatGPT Plus, US$ 0, tools/img_codex.py) para ver se passa e como o público reage; a fal ficou sem saldo.
  # Config = rodada r2 de testes/codex-2026-11-23-r2/AMOSTRA.md (3 refs nano-banana do 015 + traço chapado e paleta fria).
  # Para voltar ao nano-banana da fal: gerador: fal e apague refs/ref_instrucao (o img_fal.py só usa refs em modelo /edit).
  gerador: codex
  gerador_fallback: gemini     # tools/img_gemini.py (gemini-nano-banana-2.1, padrão 1K, com as mesmas refs) em falha, recusa ou cota do Codex
  modelo_gemini: gemini-nano-banana-2.1   # testes/gemini-2026-11-23/TESTE.md: 6/6, sem moldura, ~US$ 0,045/img
  parametros_gemini: {imageSize: 1K}
  modelo: fal-ai/nano-banana     # gerador até o 015 (teste de estilo de 2026-11-04, testes/ESTILO.md + ESTILO-es.md); só se voltar a gerador: fal
  qualidade: medium
  tamanho: landscape_16_9        # img_fal manda aspect_ratio 16:9 ao nano-banana; img_codex/img_gemini salvam 1536x864 (o 015 do nano-banana era 1344x768, mesma proporção)
  refs:                          # refs de ESTILO (nano-banana do 015-gru): lugar, interior com pessoas, retrato
    - videos/015-gru/imagens/I003.jpg
    - videos/015-gru/imagens/I040.jpg
    - videos/015-gru/imagens/I090.jpg
  ref_instrucao: "Use the attached reference images ONLY as a style guide: draw in exactly the same art style as the reference images (clean graphic novel ink illustration, even bold black outlines, large areas of flat matte color, simple hard-edged cel shadows, very little cross-hatching or fine texture, no painterly brushwork, no gradients, no wet reflections, muted desaturated cool palette of slate blue, olive green, sepia and charcoal, cool even lighting (night scenes stay dark), only small deep red accents). Do not copy their content, people or composition. Keep the composition simple and uncluttered like the references. Draw only the people the scene describes (if the scene describes only objects or a place, draw no people at all) and no famous landmarks unless the scene names them. No frame, no border. New scene: "
  # 2026-11-05 (002-mossad): tirado "subtle paper grain texture" (Hipótese da biblia/visual.md: a frase puxa a moldura)
  # 2026-11-23: estilo reescrito para o Codex (r2); o do nano-banana era: "Graphic novel ink illustration for a history documentary, bold clean black ink outlines, realistic adult proportions and faces, muted desaturated palette of slate blue, olive green, sepia and charcoal with small deep red accents, cinematic lighting, detailed period-accurate setting, 16:9 wide shot, no text, no letters, no captions, no watermark, no swastikas or extremist insignia"
  estilo_prompt: "Clean graphic novel ink illustration for a history documentary, even bold black ink outlines, large flat matte color areas with simple hard-edged cel shadows, minimal hatching, no painterly texture, no gradients, realistic adult proportions and faces, muted desaturated cool palette of slate blue, olive green, sepia and charcoal with small deep red accents, no warm amber or golden glow, simple uncluttered composition, period-accurate setting, 16:9 wide shot, no text, no letters, no captions, no watermark, no swastikas or extremist insignia"
  cor_destaque: "#B3261E"    # rojo sello
  papel: "#E9DFC9"           # carpeta / papel del expediente
piloto:
  - TODA la historia de la CIA en 11 minutos     # youtube.videos id 7, canais/dossie-es/videos/001-cia
  - TODA la historia de la KGB en N minutos      # roteiro pt em arquivo-ptbr/001-kgb-ptbr (adaptar nativamente, não traduzir)
  - TODA la historia del Mossad en N minutos
referencias:
  - Archive in Minutes (en), template e temas
  - Atlas del Tiempo (es), único canal da fórmula em es com tração (organizações 10-40× os países)
  - Te lo Pinto (es), "La HISTORIA COMPLETA de la KGB": 139 mil
