slug: historia-ptbr
nome: História em minutos
url: a definir
idioma: pt-BR
nicho: história mundial (países, impérios, civilizações)
token: historia-ptbr      # ~/.segredos/youtube/tokens/historia-ptbr.json
status: em preparação (piloto)
formula:
  modelo: History in Minutes (UCYjRQ6T2BxBnJtPytI9OnNg) e Genius History (UC-q0RDBWjYlYA2KkPzq0WSQ)
  titulo: "A história INTEIRA de X em N minutos"   # INTEIRA desde 04/11/2026 (Rodrigo); N = duração real
  duracao_min: 12-20
  estrutura: cronologia completa do país ou império, das origens até hoje, em 13-16 capítulos-objeto (desde o 003)
voz:
  motor: fish             # Fish.audio; chave em ~/.segredos/fish.env
  voz: 48613fc675f84984981683d92266e543   # clone feito pelo Rodrigo no Fish (pt-BR)
  modelo: s2.1-pro        # API paga com crédito pré-pago (ver financas.saldo_pre_pago)
  velocidade: 1.0         # aprovado pelo Rodrigo; 0.95 soou lento
  modo: por_frase         # tools/tts_fish.py --por-frase (A/B do 003, 04/11/2026: menos "robótico"; ver videos/003-ira/amostras-voz/LEIA.md)
piloto:
  - A HISTÓRIA COMPLETA do Japão em N minutos
  - A HISTÓRIA COMPLETA do Egito em N minutos
  - A HISTÓRIA COMPLETA de Roma em N minutos
visual:
  gerador: fal              # 04/11: OpenAI sem crédito, Rodrigo pediu fal.ai — openai (tools/img_openai.py) | fal (tools/img_fal.py, conta liberada em 03/11)
  modelo_openai: gpt-image-2
  qualidade: medium         # low ficou ruim no vídeo (feedback do Rodrigo, 02/11); thumbnail em high
  modelo: fal-ai/flux/dev
  tamanho: {width: 1536, height: 864}   # 04/11 (003): landscape_16_9 sai 1024x576 e borra no Ken Burns em 1080p; 1536x864 ≈ 1,33 MP ≈ US$ 0,033/img no flux/dev
  estilo_prompt: "Simple hand-drawn cartoon illustration in the style of an educational history YouTube channel, thick clean black outlines, flat bright colors, soft cel shading, characters are simple stick-figure-like people with round white heads, dot eyes and expressive simple faces, detailed but clean backgrounds, bright blue sky with small white clouds when outdoors, warm earthy palette, 16:9 wide shot, no text, no letters, no watermark"
