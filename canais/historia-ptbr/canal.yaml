slug: historia-ptbr
nome: História em minutos
url: a definir
idioma: pt-BR
nicho: história mundial (países, impérios, civilizações)
token: historia-ptbr      # ~/.segredos/youtube/tokens/historia-ptbr.json
status: em preparação (piloto)
formula:
  modelo: History in Minutes (UCYjRQ6T2BxBnJtPytI9OnNg) e Genius History (UC-q0RDBWjYlYA2KkPzq0WSQ)   # bíblia do canal em biblia/
  titulo: "A história INTEIRA de X em N minutos"   # INTEIRA desde 04/11/2026 (Rodrigo); N = duração real
  duracao_min: 12-20
  estrutura: narrativa contínua (molde History in Minutes), das origens até hoje, em 8-10 eras ligadas por causa e consequência; regra completa em biblia/roteiro.md (capítulos-objeto revogados em 04/11/2026, são do dossie-es)
voz:
  motor: fish             # Fish.audio; chave em ~/.segredos/fish.env
  voz: 48613fc675f84984981683d92266e543   # clone feito pelo Rodrigo no Fish (pt-BR)
  modelo: drama-3         # desde 05/11/2026 (Rodrigo, BRIEF-historia-003-v2-fase2): drama-3, US$ 10/M bytes até 12/11 e US$ 50/M depois; antes s2.1-pro
  velocidade: 1.0         # aprovado pelo Rodrigo; 0.95 soou lento
  modo: bloco             # 1 chamada por bloco (técnica da amostra B2, v2-amostras/voz/); gaps 0,35/0,9/1,5 s no build.py. Antes: por_frase (A/B de 04/11)
piloto:
  - A HISTÓRIA COMPLETA do Japão em N minutos
  - A HISTÓRIA COMPLETA do Egito em N minutos
  - A HISTÓRIA COMPLETA de Roma em N minutos
visual:
  gerador: codex            # 14/11/2026 (Rodrigo): cenas e thumb pelo Codex CLI (ChatGPT Plus, US$ 0, tools/img_codex.py), com as mesmas refs/ref_instrucao/estilo_prompt
  gerador_fallback: fal     # reserva automática (tools/img_fal.py com o `modelo` abaixo) em erro, recusa, limite de cota ou imagem ruim; antes de 14/11 o gerador era o fal (05/11: nano-banana-2.1/edit + refs)
  modelo_openai: gpt-image-2
  qualidade: medium         # low ficou ruim no vídeo (feedback do Rodrigo, 02/11); thumbnail em high
  modelo: google/nano-banana-2.1/edit   # 05/11/2026; o fal-ai/flux/dev SAIU do canal (sumiam os bonequinhos, 003 v1)
  refs:                     # 2–3 imagens gpt-image-2 do canal como referência de ESTILO (bonequinhos de cabeça redonda)
    - videos/001-egito/imagens/I041.jpg
    - videos/002-india/imagens/I041.jpg
    - videos/001-egito/imagens/I120.jpg
  ref_instrucao: "Use the attached reference images ONLY as a style guide: draw in exactly the same art style as the reference images (simple cartoon people with round white heads, dot eyes, simple expressive faces, thick black outlines, flat bright colors, soft cel shading). Do not copy their content or composition. IMPORTANT: every person, including kings, nobles, soldiers and clerics, must be drawn as the same round-white-head cartoon character with dot eyes and a simple expressive mouth; beards, mustaches, crowns and turbans are simple flat shapes added onto the round white head; never draw realistic or detailed human faces, no frame, no border. New scene: "
  parametros: {aspect_ratio: "16:9", resolution: "1K", output_format: jpeg, thinking_level: minimal}   # sai 1376x768; o img_fal.py reescala para 1536x864
  tamanho: {width: 1536, height: 864}   # tamanho final do arquivo (o img_fal.py reescala); landscape_16_9 do flux saía 1024x576 e borrava
  estilo_prompt: "Simple hand-drawn cartoon illustration in the style of an educational history YouTube channel, thick clean black outlines, flat bright colors, soft cel shading, characters are simple stick-figure-like people with round white heads, dot eyes and expressive simple faces, detailed but clean backgrounds, bright blue sky with small white clouds when outdoors, warm earthy palette, 16:9 wide shot, no text, no letters, no watermark"
